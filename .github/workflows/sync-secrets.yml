name: sync-secrets

# Manual y sin inputs. Copia las credenciales de Spotify desde los secretos del entorno `secrets` de
# GitHub hacia Parameter Store (SecureString), que es lo que lee el backend. Idempotente: solo escribe
# lo que difiere, valida que estén los tres secretos antes de escribir y nunca restaura un refresh
# token que Spotify ya rotó (ver src/config/spotify-secrets-sync.ts). Los despliegues de código no
# dependen de este workflow: se corre en la carga inicial y en cada rotación de credenciales.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tracks365-secrets
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'matigaleanodev/365-tracks-api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: secrets
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      ACCOUNT: '650387442642'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::650387442642:role/tracks365-secrets
          aws-region: us-east-1
          allowed-account-ids: '650387442642'
          role-session-name: tracks365-secrets-${{ github.run_id }}
      - name: Sincronizar Parameter Store
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          identity=$(aws sts get-caller-identity --output json)
          test "$(jq -r .Account <<< "$identity")" = "$ACCOUNT"
          [[ "$(jq -r .Arn <<< "$identity")" == arn:aws:sts::$ACCOUNT:assumed-role/tracks365-secrets/* ]]
          node scripts/sync-spotify-secrets.ts | tee sync.txt
          { echo "### Parámetros de Spotify"; echo; sed 's/^/- /' sync.txt; } >> "$GITHUB_STEP_SUMMARY"
